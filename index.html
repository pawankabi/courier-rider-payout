    <script>
      // Filter benign Vite HMR client disconnect/transport noise when HMR is disabled by platform
      (function() {
        var isViteNoise = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return (
            s.indexOf('[vite]') !== -1 ||
            s.indexOf("reading 'send'") !== -1 ||
            s.indexOf('reading "send"') !== -1 ||
            s.indexOf('cannot read properties of undefined') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('websocket closed without opened') !== -1
          );
        };

        var origError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + (arg && (arg.message || arg.stack || (typeof arg === 'string' ? arg : '')));
          }
          if (isViteNoise(str)) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + (arg && (arg.message || arg.stack || (typeof arg === 'string' ? arg : '')));
          }
          if (isViteNoise(str)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        window.onerror = function(msg, url, line, col, error) {
          var text = (msg || '') + ' ' + (error && (error.message || error.stack) || '');
          if (isViteNoise(text)) {
            return true;
          }
        };

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && (e.error.message || e.error.stack)) || '');
          if (isViteNoise(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason && (e.reason.message || e.reason.stack || e.reason));
          if (isViteNoise(String(reason))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
