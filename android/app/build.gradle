apply plugin: 'com.android.application'

android {
    namespace = "com.courierpayout.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.courierpayout.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100075
        versionName "1.0.75"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        adminRelease {
            def adminPlayKey = file('keystore/admin-playstore-release.keystore')
            if (adminPlayKey.exists()) {
                storeFile adminPlayKey
                storeType 'PKCS12'
                storePassword 'CPPro@2026#PlayKey'
                keyAlias 'courierpayout_pro_release'
                keyPassword 'CPPro@2026#PlayKey'
            } else {
                initWith signingConfigs.debug
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
        riderRelease {
            def riderKey = file('keystore/release.keystore')
            if (riderKey.exists()) {
                storeFile riderKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else {
                initWith signingConfigs.debug
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    flavorDimensions "version"
    productFlavors {
        admin {
            dimension "version"
            applicationId "com.courierpayout.pro"
            versionCode 100075
            versionName "1.0.75"
            signingConfig signingConfigs.adminRelease
            manifestPlaceholders = [
                appName: "Courier Payout Pro",
                appAuth: "com.courierpayout.pro.fileprovider",
                customUrlScheme: "com.courierpayout.pro"
            ]
        }
        rider {
            dimension "version"
            applicationId "com.courierpayout.rider"
            versionCode 100075
            versionName "1.0.75"
            signingConfig signingConfigs.riderRelease
            manifestPlaceholders = [
                appName: "COD Entry (Rider)",
                appAuth: "com.courierpayout.rider.fileprovider",
                customUrlScheme: "com.courierpayout.rider"
            ]
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                if (variant.flavorName == 'admin') {
                    outputFileName = "app-admin-release.apk"
                } else if (variant.flavorName == 'rider') {
                    outputFileName = "app-rider-release.apk"
                }
            }
        }
    }

    buildTypes {
        release {
            // Leave signingConfig unset here so adminRelease and riderRelease flavor configs apply cleanly
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Uses each flavor's signingConfig
        }
    }
    lintOptions {
        abortOnError false
    }
}

tasks.configureEach { task ->
    if (task.name.contains("CheckAarMetadata")) {
        task.enabled = false
    }
}


configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.fragment:fragment:1.8.5'
        force 'androidx.appcompat:appcompat:1.7.0'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
