name: Build Android APK (Clean Pipeline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        env:
          CI: false
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || npx cap copy android

      - name: Setup Keystore
        run: |
          mkdir -p android/app/keystore
          if [ ! -f android/app/keystore/release.keystore ]; then
            keytool -genkey -v -keystore android/app/keystore/release.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CourierPayout,O=CourierPayout,C=IN"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK File
        uses: actions/upload-artifact@v4
        with:
          name: Courier-Rider-Payout-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK File (Direct Update Ready)
        uses: actions/upload-artifact@v4
        with:
          name: Courier-Rider-Payout-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
