name: Build Android APK (Clean Pipeline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Automated Release Pipeline with Public GitHub Releases (v1.0.5)
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Clean & Build Web Assets
        env:
          CI: false
        run: |
          rm -rf dist android/app/src/main/assets/public
          npm run build
          npx cap copy android
          npx cap sync android

      - name: Verify Web Assets in Android
        run: |
          if [ ! -d "android/app/src/main/assets/public" ]; then
            echo "Error: Android assets directory missing!" && exit 1
          fi
          echo "Verified: Android assets directory exists with $(ls -1 android/app/src/main/assets/public | wc -l) entries."

      - name: Setup Keystore
        run: |
          mkdir -p android/app/keystore
          if [ ! -f android/app/keystore/release.keystore ]; then
            keytool -genkey -v -keystore android/app/keystore/release.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CourierPayout,O=CourierPayout,C=IN"
          fi

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | head -1 | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building Release APK for Version: v$VERSION_NAME (Code: $VERSION_CODE)"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Official Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Courier-Rider-Payout-v${{ steps.get_version.outputs.version_name }}-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Prepare Release APK Asset
        run: |
          cp android/app/build/outputs/apk/release/*.apk app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: Courier Rider Payout v${{ steps.get_version.outputs.version_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
