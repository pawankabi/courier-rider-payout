name: Build Standalone Android APKs (Admin & COD Rider)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Clean & Build Multi-App Web Assets (Admin & Rider Companion)
        env:
          CI: false
        run: |
          npm run sync:flavors

      - name: Verify Web Assets in Android Flavors
        run: |
          if [ ! -d "android/app/src/admin/assets/public" ]; then
            echo "Error: Admin assets directory missing!" && exit 1
          fi
          if [ ! -d "android/app/src/rider/assets/public" ]; then
            echo "Error: Rider companion assets directory missing!" && exit 1
          fi
          echo "Verified Admin Assets: $(ls -1 android/app/src/admin/assets/public | wc -l) entries."
          echo "Verified Rider Assets: $(ls -1 android/app/src/rider/assets/public | wc -l) entries."

      - name: Setup Keystore
        run: |
          mkdir -p android/app/keystore
          if [ ! -f android/app/keystore/release.keystore ]; then
            keytool -genkey -v -keystore android/app/keystore/release.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CourierPayout,O=CourierPayout,C=IN"
          fi

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | head -1 | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building Release APKs for Version: v$VERSION_NAME (Code: $VERSION_CODE)"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile Both Release APKs (Admin & COD Rider Companion)
        run: |
          cd android
          ./gradlew assembleAdminRelease assembleRiderRelease --no-daemon

      - name: Collect & Standardize Release APKs
        run: |
          # Copy Admin Release APK
          ADMIN_APK=$(find android/app/build/outputs/apk/admin/release -name "*.apk" | head -n 1)
          if [ -f "$ADMIN_APK" ]; then
            cp "$ADMIN_APK" Admin-Payout-Release.apk
            echo "Found Admin APK: $ADMIN_APK -> Admin-Payout-Release.apk"
          else
            echo "Error: Admin Release APK not found!" && exit 1
          fi

          # Copy Rider Companion Release APK
          RIDER_APK=$(find android/app/build/outputs/apk/rider/release -name "*.apk" | head -n 1)
          if [ -f "$RIDER_APK" ]; then
            cp "$RIDER_APK" COD-Entry-Rider-Release.apk
            echo "Found Rider Companion APK: $RIDER_APK -> COD-Entry-Rider-Release.apk"
          else
            echo "Error: Rider Release APK not found!" && exit 1
          fi

      - name: Upload Admin Payout Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Admin-Payout-Release-v${{ steps.get_version.outputs.version_name }}
          path: Admin-Payout-Release.apk
          retention-days: 30

      - name: Upload COD Entry Rider Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: COD-Entry-Rider-Release-v${{ steps.get_version.outputs.version_name }}
          path: COD-Entry-Rider-Release.apk
          retention-days: 30

      - name: Publish Official GitHub Release with Both Standalone APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: Courier Payout & COD Entry v${{ steps.get_version.outputs.version_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Admin-Payout-Release.apk
            COD-Entry-Rider-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
