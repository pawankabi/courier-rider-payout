<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Delivery Box Base & Fast Courier Motif -->
  <g filter="url(#shadow)">
    <!-- Main Parcel Body -->
    <path d="M156 196 L256 140 L356 196 L256 252 Z" fill="#60A5FA"/>
    <path d="M156 196 L256 252 L256 376 L156 320 Z" fill="#2563EB"/>
    <path d="M356 196 L256 252 L256 376 L356 320 Z" fill="#1D4ED8"/>
    
    <!-- Parcel Tape / Ribbon -->
    <path d="M236 151 L256 140 L276 151 L276 263 L256 252 L236 263 Z" fill="#93C5FD" opacity="0.8"/>
    <path d="M236 263 L256 252 L276 263 L276 387 L256 376 L236 387 Z" fill="#3B82F6" opacity="0.9"/>
  </g>

  <!-- Speed Motion Trails -->
  <path d="M84 220 L132 220" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M60 256 L124 256" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  <path d="M96 292 L136 292" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- Indian Rupee Badge Floating at Bottom-Right -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="356" r="76" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Rupee Symbol -->
    <text x="360" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>
  </g>

  <!-- Star / Incentive Badge at Top Right -->
  <circle cx="380" cy="132" r="34" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M380 114 L385 125 L397 126 L388 135 L391 147 L380 141 L369 147 L372 135 L363 126 L375 125 Z" fill="#FFFFFF"/>
</svg>
